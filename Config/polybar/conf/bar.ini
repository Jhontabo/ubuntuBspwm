[bar/main]
monitor =
bottom = false
fixed-center = true
width = 100%
height = 34
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
line-color = ${colors.ac}
border-bottom-size = 2
border-bottom-color = ${colors.ac}
padding = 1
module-margin-left = 0
module-margin-right = 1
font-0 = "Hack Nerd Font Mono:size=11;2"
font-1 = "Hack Nerd Font:size=11;2"
font-2 = "FontAwesome:size=11;2"
separator = " "
separator-foreground = ${colors.muted}
cursor-click = pointer
cursor-scroll = ns-resize

modules-left = workspaces
modules-center =
modules-right = ${env:POLYBAR_RIGHT_MODULES:date sep volume sep audio-output sep keyboard sep cpu sep ram sep battery sep wifi sep nightlight sep powermenu sep tray}

wm-restack = bspwm
enable-ipc = true

[module/tray]
type = internal/tray
format = <tray>
format-padding = 2
format-background = ${colors.bg}
