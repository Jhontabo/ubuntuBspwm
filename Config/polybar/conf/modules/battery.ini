[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
interval = 5
full-at = 99
low-at = 15
format-charging = <label-charging>
format-charging-prefix = "  "
format-charging-prefix-font = 2
format-charging-prefix-foreground = ${colors.ac}
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-full-prefix = "  "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.fg}
format-low = <label-low>
format-low-prefix = "  "
format-low-prefix-font = 2
format-foreground = ${colors.fg}
format-background = ${colors.bg}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = %percentage%%
label-low-foreground = ${colors.ac}

ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""
ramp-capacity-5 = ""
ramp-capacity-6 = ""
ramp-capacity-7 = ""
ramp-capacity-8 = ""
ramp-capacity-9 = ""
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.ac}
