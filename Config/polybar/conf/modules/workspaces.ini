[module/workspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = true
font-0 = "Hack Nerd Font Mono:size=13;2"
font-2 = "Font Awesome 6 Free Solid:size=16;2"
icon-0 = 1;☠
icon-1 = 2;☠
icon-2 = 3;☠
icon-3 = 4;☠
icon-4 = 5;☠
icon-5 = 6;☠
icon-6 = 7;☠
icon-7 = 8;☠
icon-8 = 9;☠
icon-9 = 10;☠
icon-default = ☠
format = <label-state>
format-padding = 0

label-active = " ☠ "
label-active-font = 2
label-active-foreground = ${colors.ac}
label-active-background = ${colors.bg}

label-occupied = " ☠ "
label-occupied-font = 2
label-occupied-foreground = ${colors.fg}
label-occupied-background = ${colors.bg}

label-urgent = " ☠ "
label-urgent-font = 2
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg}

label-empty = " ☠ "
label-empty-font = 2
label-empty-foreground = ${colors.muted}
label-empty-background = ${colors.bg}
