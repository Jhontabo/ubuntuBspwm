[module/workspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = true
font-0 = "Hack Nerd Font Mono:size=11;2"

icon-0 = I;1
icon-1 = II;2
icon-2 = III;3
icon-3 = IV;4
icon-4 = V;5
icon-5 = VI;6
icon-6 = VII;7
icon-7 = VIII;8
icon-8 = IX;9
icon-9 = X;10
icon-default = %name%
format = <label-state>
format-padding = 0

label-active = " ● "
label-active-font = 0
label-active-foreground = ${colors.ac}
label-active-background = ${colors.bg}
label-active-underline = ${colors.ac}
label-active-underline-size = 3

label-occupied = " ● "
label-occupied-font = 0
label-occupied-foreground = ${colors.red}
label-occupied-background = ${colors.bg}

label-urgent = " ● "
label-urgent-font = 0
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}

label-empty = " ● "
label-empty-font = 0
label-empty-foreground = ${colors.ghost}
label-empty-background = ${colors.bg}
