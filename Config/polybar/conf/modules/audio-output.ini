[module/audio-output]
type = custom/script
exec = ~/.config/polybar/scripts/audio-output
exec-if = pactl info 2>/dev/null | grep -q "Default Sink"
click-left = ~/.config/polybar/scripts/audio-output --toggle
click-right = ~/.config/bspwm/scripts/audio_switcher
scroll-up = ~/.config/polybar/scripts/audio-output --toggle
scroll-down = ~/.config/polybar/scripts/audio-output --toggle
interval = 2
label = %output%
label-foreground = ${colors.fg}
label-background = ${colors.bg}
label-padding = 1
label-font = 1
