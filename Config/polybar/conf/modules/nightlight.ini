[module/nightlight]
type = custom/script
exec = ~/.config/polybar/scripts/nightlight
interval = 2
click-left = ~/.config/polybar/scripts/nightlight toggle
scroll-up = ~/.config/polybar/scripts/nightlight up
scroll-down = ~/.config/polybar/scripts/nightlight down
click-right = ~/.config/polybar/scripts/nightlight reset
format = <label>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
label = %output%
label-font = 2
